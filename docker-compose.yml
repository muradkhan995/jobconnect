# Local development services. Production uses managed services (docs/06-architecture/01-system-architecture.md §4).
# Production uses Cloudflare R2 for files; locally s3mock speaks the same S3 API.
services:
  postgres:
    # Keep the major version equal to production (Neon) – docs/05-design/01-data-model.md §7.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobconnect
      POSTGRES_PASSWORD: jobconnect
      POSTGRES_DB: jobconnect
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobconnect -d jobconnect"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches every email the app sends locally. Inbox UI: http://localhost:8025
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    # S3-compatible storage for CVs (local/CI only). NOTE: s3mock does not verify request
    # signatures, so signed-URL expiry is only enforced by real R2 (docs/08-testing).
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: jobconnect-cvs
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  postgres-data:
